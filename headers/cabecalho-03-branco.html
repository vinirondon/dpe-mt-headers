<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPE-MT | Navegação</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    .footer {
      width: 100%;
      background: #1a3d2b;
      position: relative;
      overflow: hidden;
    }
    .footer::before {
      content: '';
      position: absolute;
      left: -30px; bottom: -30px;
      width: 180px; height: 180px;
      background: #2d6a45;
      transform: rotate(18deg);
      opacity: .2;
      pointer-events: none;
    }
    .footer::after {
      content: '';
      position: absolute;
      right: -40px; top: -20px;
      width: 200px; height: 160px;
      background: #2d6a45;
      transform: rotate(18deg);
      opacity: .2;
      pointer-events: none;
    }

    .footer-top {
      border-bottom: 0.5px solid rgba(255,255,255,.12);
      padding: 28px 32px 20px;
      position: relative;
      z-index: 2;
    }
    .nav-label {
      font-size: .65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: #4caf7d;
      margin-bottom: 16px;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 6px;
      border: 0.5px solid rgba(255,255,255,.10);
      text-decoration: none;
      transition: background .15s, border-color .15s;
      background: rgba(255,255,255,.04);
    }
    .nav-link:hover {
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.22);
    }
    .nav-link i { font-size: 20px; color: #4caf7d; flex-shrink: 0; }
    .nav-link-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .nav-link-title { font-size: 12px; font-weight: 500; color: #fff; line-height: 1.3; }
    .nav-link-desc { font-size: 10px; color: rgba(255,255,255,.40); }

    .footer-bottom {
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }
    .brand-line { display: flex; align-items: center; gap: 8px; }
    .brand-line i { font-size: 15px; color: #4caf7d; }
    .brand-line span { font-size: 11px; color: rgba(255,255,255,.35); }
    .update-info { font-size: 10px; color: rgba(255,255,255,.25); display: flex; align-items: center; gap: 4px; }
    .update-info i { font-size: 12px; }

    @media (max-width: 700px) {
      .nav-grid { grid-template-columns: 1fr 1fr; }
      .footer-top { padding: 20px 16px 16px; }
      .footer-bottom { flex-direction: column; gap: 6px; align-items: flex-start; padding: 12px 16px; }
    }
  </style>
</head>
<body>

<footer class="footer">
  <div class="footer-top">
    <p class="nav-label">Painéis principais</p>
    <div class="nav-grid">

      <!-- =============================================
           EDITE OS href="" COM OS LINKS DO SEU METABASE
           ============================================= -->

      <a class="nav-link" href="LINK_ATENDIMENTOS" target="_blank">
        <i class="ti ti-users"></i>
        <div class="nav-link-text">
          <span class="nav-link-title">Atendimentos Geral</span>
          <span class="nav-link-desc">Visão geral</span>
        </div>
      </a>

      <a class="nav-link" href="LINK_RMA" target="_blank">
        <i class="ti ti-shield-check"></i>
        <div class="nav-link-text">
          <span class="nav-link-title">RMA - Corregedoria</span>
          <span class="nav-link-desc">Atividades e inspeções</span>
        </div>
      </a>

      <a class="nav-link" href="LINK_AGENDA" target="_blank">
        <i class="ti ti-calendar"></i>
        <div class="nav-link-text">
          <span class="nav-link-title">Agenda Defensores</span>
          <span class="nav-link-desc">Agendamentos</span>
        </div>
      </a>

      <a class="nav-link" href="LINK_ASSISTIDOS" target="_blank">
        <i class="ti ti-heart-handshake"></i>
        <div class="nav-link-text">
          <span class="nav-link-title">Perfil Assistidos</span>
          <span class="nav-link-desc">Dados socioeconômicos</span>
        </div>
      </a>

      <a class="nav-link" href="LINK_PROCESSOS" target="_blank">
        <i class="ti ti-scale"></i>
        <div class="nav-link-text">
          <span class="nav-link-title">Análise de Processos</span>
          <span class="nav-link-desc">Distribuição por comarca</span>
        </div>
      </a>

    </div>
  </div>

  <div class="footer-bottom">
    <div class="brand-line">
      <i class="ti ti-scale"></i>
      <span>Defensoria Pública do Estado de Mato Grosso · CDI</span>
    </div>
    <div class="update-info">
      <i class="ti ti-clock"></i>
      <span id="ano-footer"></span>
    </div>
  </div>
</footer>

<script>
  document.getElementById('ano-footer').textContent = new Date().getFullYear();
</script>

</body>
</html>
