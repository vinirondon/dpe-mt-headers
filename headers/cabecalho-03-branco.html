<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPE-MT | Cabeçalho 03 — Branco Institucional</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--branco);
    }

    .header {
      height: 88px;
      width: 100%;
      display: flex;
      align-items: center;
      background: var(--branco);
      border-bottom: 3px solid var(--verde-principal);
      position: relative;
    }

    /* Linha decorativa tênue acima da borda */
    .header::before {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 148px;
      right: 0;
      height: 1px;
      background: var(--cinza-200);
    }

    .brand-area {
      width: 148px;
      height: 100%;
      border-right: 1px solid var(--cinza-200);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo {
      height: 62px;
      width: auto;
      object-fit: contain;
    }

    .content {
      padding-left: var(--gap-lg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .title {
      font-family: var(--font-display);
      color: var(--verde-escuro);
      font-size: 1.20rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--cinza-500);
      font-family: var(--font-body);
      font-size: .70rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .right-block {
      margin-left: auto;
      padding-right: var(--gap-xl);
      display: flex;
      align-items: center;
      gap: var(--gap-md);
    }

    .tag {
      padding: 5px 14px;
      background: var(--verde-suave);
      border-radius: 4px;
      font-family: var(--font-display);
      font-size: .68rem;
      font-weight: 700;
      color: var(--verde-escuro);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-left: 3px solid var(--verde-principal);
    }

    @media (max-width: 768px) {
      .brand-area { width: 100px; }
      .logo { height: 48px; }
      .title { font-size: .95rem; }
      .right-block { display: none; }
    }
  </style>
</head>
<body>
  <header class="header">

    <div class="brand-area">
      <img src="../assets/logo-fundo-branco.jpeg"
           alt="Defensoria Pública do Estado de Mato Grosso"
           class="logo">
    </div>

    <div class="content">
      <h1 class="title">Defensoria Pública do Estado de Mato Grosso</h1>
      <p class="subtitle">Painel Estratégico de Indicadores</p>
    </div>

    <div class="right-block">
      <span class="tag">Gestão 2025</span>
    </div>

  </header>
</body>
</html>
