<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPE-MT | Cabeçalho 04 — Split Bicolor</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .header {
      height: 88px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Metade esquerda verde */
    .header::before {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 50%;
      height: 100%;
      background: var(--verde-principal);
      z-index: 0;
    }

    /* Metade direita branca */
    .header::after {
      content: '';
      position: absolute;
      right: 0; top: 0;
      width: 50%;
      height: 100%;
      background: var(--branco);
      z-index: 0;
    }

    .left-content {
      padding-left: var(--gap-xl);
      position: relative;
      z-index: 1;
    }

    .institution-name {
      font-family: var(--font-display);
      font-size: .65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: rgba(255,255,255,.70);
      margin-bottom: 5px;
    }

    .dashboard-title {
      font-family: var(--font-display);
      font-size: 1.10rem;
      font-weight: 700;
      color: var(--branco);
      line-height: 1.15;
    }

    /* Logo centralizada sobre a divisória */
    .brand-center {
      width: 120px;
      height: 80px;
      background: var(--branco);
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }

    .logo {
      height: 60px;
      width: auto;
      object-fit: contain;
    }

    .right-content {
      padding-right: var(--gap-xl);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      position: relative;
      z-index: 1;
    }

    .right-label {
      font-family: var(--font-body);
      font-size: .62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--cinza-500);
      margin-bottom: 4px;
    }

    .right-title {
      font-family: var(--font-display);
      font-size: 1.10rem;
      font-weight: 700;
      color: var(--verde-escuro);
    }

    @media (max-width: 768px) {
      .header {
        grid-template-columns: 1fr 90px 1fr;
      }
      .left-content { padding-left: var(--gap-md); }
      .right-content { padding-right: var(--gap-md); }
      .brand-center { width: 90px; height: 70px; }
      .logo { height: 50px; }
      .institution-name { display: none; }
      .dashboard-title { font-size: .85rem; }
      .right-label { display: none; }
      .right-title { font-size: .85rem; }
    }
  </style>
</head>
<body>
  <header class="header">

    <div class="left-content">
      <p class="institution-name">Defensoria Pública · MT</p>
      <h1 class="dashboard-title">Painel Estratégico<br>de Indicadores</h1>
    </div>

    <div class="brand-center">
      <img src="../assets/logo-fundo-branco.jpeg"
           alt="Defensoria Pública do Estado de Mato Grosso"
           class="logo">
    </div>

    <div class="right-content">
      <span class="right-label">Exercício fiscal</span>
      <span class="right-title">2025</span>
    </div>

  </header>
</body>
</html>
