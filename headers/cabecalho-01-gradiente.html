<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPE-MT | Cabeçalho 01 — Gradiente Horizontal</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .header {
      height: 220px;
      width: 100%;
      display: flex;
      align-items: center;
      background: linear-gradient(
        100deg,
        var(--verde-escuro) 0%,
        var(--verde-principal) 50%,
        var(--verde-claro) 100%
      );
      position: relative;
      overflow: hidden;
    }

    /* Textura sutil de padrão */
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255,255,255,.03) 0px,
        rgba(255,255,255,.03) 1px,
        transparent 1px,
        transparent 8px
      );
      pointer-events: none;
    }

    .brand-area {
      width: 148px;
      height: 100%;
      background: var(--branco);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 2px 0 12px rgba(0,0,0,.10);
      position: relative;
      z-index: 1;
    }

    .logo {
      height: 110px;
      width: auto;
      object-fit: contain;
      border-radius: 16px;
    }

    /* Divisor decorativo */
    .divider {
      width: 2px;
      height: 0px;
      background: rgba(255,255,255,.30);
      margin: 0 var(--gap-lg);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .title {
      font-family: var(--font-display);
      color: var(--branco);
      font-size: 1.30rem;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.3px;
    }

    .subtitle {
      margin-top: 5px;
      color: rgba(255,255,255,.80);
      font-family: var(--font-body);
      font-size: .70rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Badge de título do painel (opcional — troque o texto conforme o dashboard) */
    .badge {
      margin-left: auto;
      margin-right: var(--gap-xl);
      padding: 6px 16px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 40px;
      color: var(--branco);
      font-family: var(--font-display);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .5px;
      white-space: nowrap;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .brand-area { width: 108px; }
      .logo { height: 52px; }
      .title { font-size: .95rem; }
      .subtitle { font-size: .60rem; }
      .badge { display: none; }
      .divider { margin: 0 var(--gap-md); }
    }
  </style>
</head>
<body>
  <header class="header">

    <div class="brand-area">
      <img src="../assets/logosemfundo.jpg"
           alt="Defensoria Pública do Estado de Mato Grosso"
           class="logo">
    </div>

    <div class="divider"></div>

    <div class="content">
      <h1 class="title">Corregedoria-Geral do Estado de Mato Grosso</h1>
      <p class="subtitle">Secretaria da Corregedoria</p>
    </div>

    <span class="badge">Painel de População Indígena (2026)</span>

  </header>
</body>
</html>
